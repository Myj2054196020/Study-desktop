<!doctype html>
<html lang='zh-CN'>
  <head>
    <meta charset='UTF-8' />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      .wrap { display: flex; flex-direction: column; height: 100vh; border-radius: 14px; background: rgba(255, 250, 215, 0.97); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28); }
      .bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; font-size: 12px; font-weight: 700; color: #92400e; -webkit-app-region: drag; }
      #close { border: none; background: transparent; color: #92400e; cursor: pointer; font-size: 12px; -webkit-app-region: no-drag; }
      #note { flex: 1; border: none; outline: none; resize: none; background: transparent; padding: 4px 12px 8px; font-size: 13px; line-height: 1.6; color: #422006; font-family: inherit; }
      #status { padding: 2px 12px 8px; font-size: 10px; color: #a16207; text-align: right; }
    </style>
  </head>
  <body>
    <div class='wrap'>
      <div class='bar'>📌 便签 <button id='close'>✕</button></div>
      <textarea id='note' placeholder='随手记点什么...'></textarea>
      <div id='status'></div>
    </div>
    <script>
      var note = document.getElementById('note')
      var statusEl = document.getElementById('status')
      var timer = null
      if (window.electronAPI) {
        window.electronAPI.loadNotesWidget().then(function (content) { note.value = content || '' })
        note.addEventListener('input', function () {
          clearTimeout(timer)
          timer = setTimeout(function () {
            window.electronAPI.saveNotesWidget(note.value)
            statusEl.textContent = '已保存'
            setTimeout(function () { statusEl.textContent = '' }, 1200)
          }, 600)
        })
        document.getElementById('close').onclick = function () { window.electronAPI.notesWidgetToggle() }
      }
    </script>
  </body>
</html>
